name: mona
description: "Day Recap App (codename mona). Spec: docs/implementation-spec.md"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  clock: ^1.1.3
  cloud_contracts:
    path: ../packages/cloud_contracts/dart
  drift: ^2.35.3
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  http: ^1.6.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  sqlite3: ^3.8.0
  supabase_flutter: ^2.18.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true

hooks:
  user_defines:
    sqlite3:
      # One SQLite library in the app: the SQLCipher build (spec §10.1, D7).
      source: sqlcipher
