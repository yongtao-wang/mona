<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Shoot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#D9D9DE}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: Inter, 'Noto Sans TC', system-ui, sans-serif">

  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 700px; background: #23262E; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr))">
    <div style="border-right: 1px solid rgba(255,255,255,0.10); border-bottom: 1px solid rgba(255,255,255,0.10)"></div>
    <div style="border-right: 1px solid rgba(255,255,255,0.10); border-bottom: 1px solid rgba(255,255,255,0.10)"></div>
    <div style="border-bottom: 1px solid rgba(255,255,255,0.10)"></div>
    <div style="border-right: 1px solid rgba(255,255,255,0.10); border-bottom: 1px solid rgba(255,255,255,0.10)"></div>
    <div style="border-right: 1px solid rgba(255,255,255,0.10); border-bottom: 1px solid rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; font-size: 13px; color: #9A9DA8">[Camera preview]</div>
    <div style="border-bottom: 1px solid rgba(255,255,255,0.10)"></div>
    <div style="border-right: 1px solid rgba(255,255,255,0.10)"></div>
    <div style="border-right: 1px solid rgba(255,255,255,0.10)"></div>
    <div></div>
  </div>

  <div style="position: absolute; left: 0; top: 0; width: 390px; padding: 58px 16px 0; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Close" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(0,0,0,0.45); font-size: 13px; font-weight: 600">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18V6l11-2v12"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle></svg>
      <span>像是演出 · Show</span>
    </div>
    <div style="width: 40px"></div>
  </div>

  <div style="position: absolute; right: 12px; top: 120px; display: flex; flex-direction: column; gap: 18px">
    <button aria-label="Flip camera" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(0,0,0,0.45); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-3l-2-3H9L7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"></path><path d="M9 13a3 3 0 0 1 5-2.2M15 13a3 3 0 0 1-5 2.2"></path></svg>
    </button>
    <button aria-label="Flash" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(0,0,0,0.45); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>
    </button>
    <button aria-label="Bystander blur" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(0,0,0,0.45); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="9" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0M3 3l18 18"></path></svg>
    </button>
  </div>

  <div style="position: absolute; left: 0; top: 610px; width: 390px; display: flex; justify-content: center">
    <div style="padding: 8px 14px; border-radius: 16px; background: rgba(0,0,0,0.55); font-size: 13px; color: #E4E4EA">拍幾秒就好，看演出比較重要</div>
  </div>

  <div style="position: absolute; left: 0; top: 700px; width: 390px; height: 144px; background: #000000; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 12px; box-sizing: border-box">
    <nav aria-label="Capture mode" style="display: flex; gap: 22px; font-size: 14px; font-weight: 600">
      <a href="Capture.dc.html" style="text-decoration: none; color: #A8A8B3">音訊</a>
      <a href="Capture.dc.html" style="text-decoration: none">影片</a>
      <a href="Meeting.dc.html" style="text-decoration: none; color: #A8A8B3">會議</a>
    </nav>
    <div style="width: 390px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; box-sizing: border-box">
      <button aria-label="Gallery" style="width: 44px; height: 44px; border: 2px solid #FFFFFF; border-radius: 10px; background: #3A3E49; padding: 0"></button>
      <button aria-label="Start recording" style="width: 76px; height: 76px; border: 5px solid #FFFFFF; border-radius: 38px; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center">
        <span style="width: 58px; height: 58px; border-radius: 29px; background: {{accent}}"></span>
      </button>
      <button aria-label="Mark this moment" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(255,255,255,0.16); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.5 6 .8-4.4 4.2 1.1 6L12 16.6 6.7 19.5l1.1-6L3.4 9.3l6-.8z"></path></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF4D5E","options":["#FF4D5E","#FF8A3D","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF4D5E' };
  }
}
</script>
</body>
</html>
