<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Live meeting</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#D9D9DE}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0B0F; color: #FFFFFF; font-family: Inter, 'Noto Sans TC', system-ui, sans-serif">

  <div style="position: absolute; left: 0; top: 0; width: 390px; padding: 58px 20px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 16px; background: #26141A; font-size: 13px; font-weight: 600">
        <span style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span>
        <span>會議 · 00:24:51</span>
      </div>
      <div style="font-size: 13px; color: #A8A8B3">4 人</div>
    </div>
    <div style="font-size: 22px; font-weight: 700">Q4 規格討論</div>
    <div style="display: flex; gap: 8px">
      <sc-for list="{{people}}" as="p" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 4px; border-radius: 14px; background: #1A1A22; font-size: 12px">
          <span style="width: 20px; height: 20px; border-radius: 10px; background: {{p.color}}; color: #0B0B0F; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{p.initial}}</span>
          <span>{{p.name}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 0; top: 216px; width: 390px; height: 420px; padding: 0 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; gap: 18px; overflow: hidden">
    <sc-for list="{{lines}}" as="l" hint-placeholder-count="5">
      <div style="display: flex; gap: 12px; opacity: {{l.opacity}}">
        <div style="width: 4px; border-radius: 2px; background: {{l.color}}; flex-shrink: 0"></div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="font-size: 12px; font-weight: 600; color: {{l.color}}">{{l.who}}</div>
          <div style="font-size: 18px; line-height: 1.45">{{l.text}}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 208px; background: #000000; display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 22px; box-sizing: border-box">
    <div style="width: 390px; display: flex; align-items: center; justify-content: space-between; padding: 0 44px; box-sizing: border-box">
      <button aria-label="Private for 30 minutes" style="border: 0; background: transparent; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px">
        <span style="width: 52px; height: 52px; border-radius: 26px; background: #1A1A22; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 9 6 9 6a16 16 0 0 1-3 3.5M6.6 6.6C4.2 8.2 3 12 3 12s4 6 9 6c1.4 0 2.7-.4 3.9-1"></path></svg></span>私密 30 分
      </button>
      <a href="Recap.dc.html" aria-label="Stop and make minutes" style="width: 76px; height: 76px; border: 5px solid #FFFFFF; border-radius: 38px; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
        <span style="width: 28px; height: 28px; border-radius: 6px; background: {{accent}}"></span>
      </a>
      <button aria-label="Mark this moment" style="border: 0; background: transparent; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px">
        <span style="width: 52px; height: 52px; border-radius: 26px; background: #1A1A22; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.5 6 .8-4.4 4.2 1.1 6L12 16.6 6.7 19.5l1.1-6L3.4 9.3l6-.8z"></path></svg></span>標記
      </button>
    </div>
    <div style="font-size: 13px; color: #A8A8B3">結束並產生會議紀錄</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF4D5E","options":["#FF4D5E","#FF8A3D","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#FF4D5E',
      people: [
        { initial: '你', name: 'You', color: '#5B8CFF' },
        { initial: 'K', name: 'Kevin', color: '#FFB37A' },
        { initial: 'J', name: '怡君', color: '#7ED6C1' },
        { initial: 'D', name: 'Speaker D', color: '#C9A6FF' }
      ],
      lines: [
        { who: 'Kevin', color: '#FFB37A', text: '這版 spec 我們禮拜五前可以定案嗎？', opacity: 0.5 },
        { who: 'You', color: '#5B8CFF', text: '可以，我禮拜四前把草稿寄給大家。', opacity: 0.7 },
        { who: '怡君', color: '#7ED6C1', text: 'API 的部分先照 v2 走，不要再改了。', opacity: 0.85 },
        { who: 'Speaker D ?', color: '#C9A6FF', text: '好。', opacity: 1 },
        { who: 'Kevin', color: '#FFB37A', text: '那 pricing 下禮拜再 sync 一次…', opacity: 1 }
      ]
    };
  }
}
</script>
</body>
</html>
