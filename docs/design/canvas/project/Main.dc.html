<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Today grid</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#D9D9DE}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0B0F; color: #FFFFFF; font-family: Inter, 'Noto Sans TC', system-ui, sans-serif">

  <div style="position: absolute; left: 0; top: 0; width: 390px; padding: 58px 16px 0; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between">
    <a href="Meeting.dc.html" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 16px; background: #26141A; text-decoration: none; font-size: 13px; font-weight: 600">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span>
      <span>錄音中 2:41</span>
    </a>
    <div style="font-size: 17px; font-weight: 700">10/27 週二</div>
    <button aria-label="Search" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: #1A1A22; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    </button>
  </div>

  <div style="position: absolute; left: 0; top: 112px; width: 390px; padding: 0 16px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); text-align: center">
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 700">9</span><span style="font-size: 12px; color: #A8A8B3">段時刻</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 700">3</span><span style="font-size: 12px; color: #A8A8B3">個承諾</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 700">2.7 h</span><span style="font-size: 12px; color: #A8A8B3">對話</span></div>
  </div>

  <nav aria-label="View" style="position: absolute; left: 0; top: 170px; width: 390px; height: 44px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid #23232B">
    <button aria-label="Grid" style="border: 0; border-bottom: 2px solid #FFFFFF; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>
    </button>
    <button aria-label="Promises and items" style="border: 0; background: transparent; color: #A8A8B3; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"></path></svg>
    </button>
    <button aria-label="Marked moments" style="border: 0; background: transparent; color: #A8A8B3; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.5 6 .8-4.4 4.2 1.1 6L12 16.6 6.7 19.5l1.1-6L3.4 9.3l6-.8z"></path></svg>
    </button>
  </nav>

  <div style="position: absolute; left: 0; top: 216px; width: 390px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="9">
      <button aria-label="{{t.aria}}" style="height: 162px; border: 0; padding: 8px; background: {{t.bg}}; color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between; text-align: left; box-sizing: border-box">
        <span style="display: flex; align-items: center; justify-content: space-between; width: 100%; font-size: 11px; font-weight: 600">
          <sc-if value="{{t.isVideo}}" hint-placeholder-val="{{false}}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>
          </sc-if>
          <sc-if value="{{t.isAudio}}" hint-placeholder-val="{{true}}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M8 6v12M12 9v6M16 4v16M20 10v4"></path></svg>
          </sc-if>
          <span>{{t.dur}}</span>
        </span>
        <span style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 13px; line-height: 1.35; font-weight: 700; opacity: {{t.quoteOpacity}}">{{t.quote}}</span>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #D5D5DC">
            <span>{{t.time}}</span>
            <sc-if value="{{t.hasItems}}" hint-placeholder-val="{{false}}">
              <span style="padding: 1px 6px; border-radius: 8px; background: #FFB37A; color: #2A1608; font-weight: 700">{{t.items}}</span>
            </sc-if>
            <sc-if value="{{t.marked}}" hint-placeholder-val="{{false}}">
              <span style="color: #FFD66B">★</span>
            </sc-if>
          </span>
        </span>
      </button>
    </sc-for>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; bottom: 0; width: 390px; height: 84px; background: #000000; display: flex; align-items: flex-start; justify-content: space-around; padding-top: 10px; box-sizing: border-box">
    <a href="Main.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>今天
    </a>
    <a href="Main.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font-size: 11px; color: #A8A8B3">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>日曆
    </a>
    <a href="Capture.dc.html" aria-label="Start shooting" style="width: 64px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <span style="width: 52px; height: 40px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <span style="width: 20px; height: 20px; border-radius: 10px; background: {{accent}}"></span>
      </span>
    </a>
    <a href="Recap.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font-size: 11px; color: #A8A8B3">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.5 6 .8-4.4 4.2 1.1 6L12 16.6 6.7 19.5l1.1-6L3.4 9.3l6-.8z"></path></svg>回顧
    </a>
    <a href="Main.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; font-size: 11px; color: #A8A8B3">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>我
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF4D5E","options":["#FF4D5E","#FF8A3D","#FFFFFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var S = { meeting: '#1C2740', call: '#173238', social: '#3A2416', show: '#2A1A3A', commute: '#23262E', solo: '#2E2A16' };
    var raw = [
      { scene: 'show', video: true, dur: '0:18', quote: '[演出片段]', time: '20:41', marked: true },
      { scene: 'show', video: true, dur: '0:09', quote: '[演出片段]', time: '20:12' },
      { scene: 'commute', dur: '12 分', quote: '通勤 · 未分析', time: '18:05', dim: true },
      { scene: 'call', dur: '38 分', quote: '「週四前寄 spec 給你」', time: '14:00', items: 1 },
      { scene: 'social', dur: '52 分', quote: '她換工作了，推薦《原子習慣》', time: '12:30', items: 2 },
      { scene: 'meeting', dur: '24 分', quote: 'API 先照 v2 走', time: '10:00', items: 3 },
      { scene: 'solo', dur: '1 分', quote: '「記得打給銀行」', time: '09:40', items: 1 },
      { scene: 'social', dur: '6 分', quote: '咖啡店閒聊', time: '09:05' },
      { scene: 'commute', dur: '20 分', quote: '通勤 · 未分析', time: '08:40', dim: true }
    ];
    return {
      accent: this.props.accent ?? '#FF4D5E',
      tiles: raw.map(function (r) {
        return {
          bg: S[r.scene], isVideo: !!r.video, isAudio: !r.video, dur: r.dur, quote: r.quote, time: r.time,
          hasItems: !!r.items, items: r.items ? r.items + ' 項' : '', marked: !!r.marked,
          quoteOpacity: r.dim ? 0.6 : 1,
          aria: r.time + ' ' + r.quote
        };
      })
    };
  }
}
</script>
</body>
</html>
