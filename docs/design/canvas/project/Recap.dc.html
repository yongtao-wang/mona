<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Evening recap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#D9D9DE}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #3A2416; color: #FFFFFF; font-family: Inter, 'Noto Sans TC', system-ui, sans-serif">

  <div style="position: absolute; left: 0; top: 0; width: 390px; padding: 54px 12px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{segments}}" as="s" hint-placeholder-count="7">
        <div style="height: 3px; border-radius: 2px; background: {{s.color}}"></div>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 15px; font-weight: 700">今晚的回顧</div>
        <div style="font-size: 12px; color: #E9D3C2">10/27 週二 · 2 / 7</div>
      </div>
      <a href="Main.dc.html" aria-label="Close recap" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>
  </div>

  <div style="position: absolute; left: 28px; top: 230px; width: 334px; display: flex; flex-direction: column; gap: 20px">
    <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; color: #FFB37A">你答應的 · YOU PROMISED</div>
    <div style="font-size: 36px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em">週四前把 spec 草稿寄給 Kevin</div>
    <div style="display: flex; gap: 8px">
      <div style="height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(0,0,0,0.3); display: flex; align-items: center; font-size: 13px; font-weight: 600">到期 週四 10/29</div>
      <div style="height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(0,0,0,0.3); display: flex; align-items: center; font-size: 13px">明早 08:30 提醒</div>
    </div>
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: rgba(0,0,0,0.3); text-decoration: none">
      <span style="width: 40px; height: 40px; border-radius: 20px; background: #FFFFFF; color: #3A2416; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px">「我禮拜四前把 spec 草稿寄給你。」</span>
        <span style="font-size: 12px; color: #E9D3C2">供應商通話 · 14:02 · 聽原話</span>
      </span>
    </a>
  </div>

  <div style="position: absolute; left: 0; bottom: 40px; width: 390px; padding: 0 20px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <button style="height: 52px; border: 0; border-radius: 26px; background: #FFFFFF; color: #3A2416; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>對
    </button>
    <button style="height: 52px; border: 0; border-radius: 26px; background: rgba(0,0,0,0.35); color: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>錯
    </button>
    <button style="height: 52px; border: 0; border-radius: 26px; background: rgba(0,0,0,0.35); color: #FFFFFF; font-size: 15px; font-weight: 600">不重要</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var done = 2;
    var segs = [];
    for (var i = 0; i < 7; i++) {
      segs.push({ color: i < done ? '#FFFFFF' : 'rgba(255,255,255,0.3)' });
    }
    return { segments: segs };
  }
}
</script>
</body>
</html>
