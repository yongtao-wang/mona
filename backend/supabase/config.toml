# Supabase project config for local development (`supabase start`). Spec §11.
project_id = "mona"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.gateway]
enabled = true
# The gateway verifies JWTs itself so it can answer with the §12.7 error contract.
verify_jwt = false
import_map = "./functions/gateway/deno.json"
